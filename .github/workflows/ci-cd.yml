name: Pipeline CI/CD - ÁguaViva (Docker)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  ci:
    name: CI - Build e Teste da Imagem Docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Verificar arquivos do projeto
        run: |
          test -f index.html
          test -f Dockerfile

      - name: Construir imagem Docker (docker build)
        run: docker build -t aguaviva-web:ci .

      - name: Testar container em execução
        run: |
          docker run -d --name aguaviva-test -p 8080:80 aguaviva-web:ci
          sleep 2
          curl -f http://localhost:8080 | grep -q "ÁguaViva"
          docker rm -f aguaviva-test

  cd:
    name: CD - Deploy do Container na EC2
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem

      - name: Enviar Dockerfile e subir container na EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "mkdir -p ~/aguaviva-app"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key.pem Dockerfile index.html ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:~/aguaviva-app/
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "
            cd ~/aguaviva-app &&
            sudo systemctl stop nginx 2>/dev/null || true &&
            sudo docker build -t aguaviva-web:latest . &&
            sudo docker rm -f aguaviva-container 2>/dev/null || true &&
            sudo docker run -d --name aguaviva-container --restart unless-stopped -p 80:80 aguaviva-web:latest
          "
